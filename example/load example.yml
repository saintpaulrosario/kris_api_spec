info:
  name: load example
  type: http
  seq: 1

http:
  method: POST
  url: http://{{ip}}:{{port}}/example
  body:
    type: json
    data: |-
      {
        "language": "mande",
        "version": 1,
        "sheet": {
          "name": "example",
          "index": 8,
          "columns": {
            "example": {
              "row": 0,
              "ordinal": 1,
              "rank": 2,
              "text": 4
            },
            "script": {
              "row": 0,
              "ordinal": 3,
              "rank": 0
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
