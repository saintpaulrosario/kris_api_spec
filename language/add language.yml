info:
  name: add language
  type: http
  seq: 1

http:
  method: POST
  url: http://{{ip}}:{{port}}/language
  body:
    type: json
    data: |-
      {
        "script": "latin",
        "version": 1,
        "sheet": {
          "name": "word",
          "word": {
            "row": 0,
            "ordinal": 1,
            "text": 3
          },
          "script": {
            "ordinal": 2
          }
        },
        "reference":{
          "name":"language",
          "word":{
            "row":0,
            "ordinal":1
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
