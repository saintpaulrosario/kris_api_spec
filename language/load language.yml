info:
  name: load language
  type: http
  seq: 1

http:
  method: POST
  url: http://{{ip}}:{{port}}/language
  body:
    type: json
    data: |-
      {
        "language": "mande",
        "version": 1,
        "refSheet": {
          "name": "language",
          "index": 9,
          "columns": {
            "word": {
              "ordinal": 1,
              "reference": {
                "ordinal": true
              }
            }
          }
        },
        "sheet": {
          "name": "word",
          "index": 1,
          "columns": {
            "word": {
              "row": 0,
              "ordinal": 1,
              "text": 5,
              "rank": 6
            },
            "script": {
              "ordinal": 2
            },
            "language": {
              "ordinal": 3
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
