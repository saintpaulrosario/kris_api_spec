info:
  name: Untitled
  type: http
  seq: 1

http:
  method: POST
  url: http://{{ip}}:{{port}}/example
  body:
    type: json
    data: |-
      {
        "script": "latin",
        "version": 1,
        "sheet": {
          "name": "word",
          "word": {
            "row": 0,
            "ordinal": 1
          },
          "script": {
            "ordinal": 2
          }
        },
        "reference": {
          "name": "example",
          "word": {
            "row": 0,
            "ordinal": 1,
            "rank": 2,
            "text": 5
          },
          "language": {
            "ordinal": 3
          },
          "dialect": {
            "ordinal": 4
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
