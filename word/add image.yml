info:
  name: add image
  type: http
  seq: 3

http:
  method: PUT
  url: http://127.0.0.1:{{port}}/word/image
  body:
    type: json
    data: |-
      {
        "script": "latin",
        "version": 1,
        "sheet": {
          "name": "word_image",
          "word": {
            "ordinal": 1
          },
          "image": {
            "ordinal": 2
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
